version = 1
SPDX-PackageName = "gnome-shell-extension-sharexf"
SPDX-PackageSupplier = "ShareXF Developers <>"
SPDX-PackageDownloadLocation = "https://github.com/ShareXF/gnome-shell-extension-sharexf"

[[annotations]]
path = ["data/icons/**", "data/images/enter-keyboard-shortcut.svg", "data/metainfo/**.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "ShareXF Developers <>"
SPDX-License-Identifier = "GPL-2.0-or-later"

# According to https://developer.chrome.com/docs/webstore/branding
[[annotations]]
path = "data/images/chrome-badge.png"
precedence = "aggregate"
SPDX-FileCopyrightText = "Google <https://developers.google.com/>"
SPDX-License-Identifier = "CC-BY-4.0"

# According to
# https://extensionworkshop.com/documentation/publish/promoting-your-extension/
[[annotations]]
path = "data/images/firefox-badge.png"
precedence = "aggregate"
SPDX-FileCopyrightText = "1998–2024 by individual mozilla.org contributors <>"
SPDX-License-Identifier = "CC-BY-SA-3.0"

[[annotations]]
path = ["po/**.po", "po/**.pot"]
precedence = "aggregate"
SPDX-FileCopyrightText = "ShareXF Community"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = "installed-tests/data/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "ShareXF Developers <>"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = "webextension/images/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "ShareXF Developers <>"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = "webextension-chrome/images/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "ShareXF Developers <>"
SPDX-License-Identifier = "GPL-2.0-or-later"
