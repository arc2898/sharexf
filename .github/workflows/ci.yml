name: Pull request checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: JavaScript and shared regression tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/sharexf-ci" --no-save --ignore-scripts ws@8.22.0

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -path './.git' -prune -o -path '*/node_modules' -prune -o -name '*.js' -type f -print0)

      - name: Run shared-library regression tests
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/sharexf-ci/node_modules
        run: |
          set -euo pipefail
          count=0
          for test in shared/test/*.js; do
            # This is an interactive network benchmark, not a deterministic regression test.
            [[ "$test" == "shared/test/movebench.js" ]] && continue
            echo "::group::${test}"
            node "$test"
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "Passed $count shared-library test files."

  platform-mesh:
    name: Mesh integration tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-24.04
            test_dir: linux/mesh/test
          - platform: Windows
            os: windows-2022
            test_dir: windows/mesh/test
          - platform: macOS
            os: macos-latest
            test_dir: mac/mesh/test
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test-only dependencies and Electron stub
        shell: bash
        run: |
          set -euo pipefail
          test_modules="$RUNNER_TEMP/sharexf-ci/node_modules"
          npm install --prefix "$RUNNER_TEMP/sharexf-ci" --no-save --ignore-scripts ws@8.22.0
          # Mesh tests inject fake OS integrations; they need Electron's module shape, not its binary.
          mkdir -p "$test_modules/electron"
          cat > "$test_modules/electron/index.js" <<'EOF'
          module.exports = {
            nativeImage: {
              createFromDataURL: () => ({ isEmpty: () => true })
            }
          };
          EOF

      - name: Run platform mesh integration tests
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/sharexf-ci/node_modules
          TEST_DIR: ${{ matrix.test_dir }}
        run: |
          set -euo pipefail
          count=0
          for test in "$TEST_DIR"/*.js; do
            echo "::group::${test}"
            node "$test"
            echo "::endgroup::"
            count=$((count + 1))
          done
          echo "Passed $count ${{ matrix.platform }} mesh test files."

  packaging-validation:
    name: Packaging manifest and script checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install YAML parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Check packaging script and Cask syntax
        run: |
          bash -n packaging/flatpak/build.sh
          ruby -c Casks/sharexf.rb

      - name: Validate Flatpak manifest
        run: |
          python3 - <<'PY'
          import yaml
          with open("packaging/flatpak/org.sharexf.ShareXF.yml", encoding="utf-8") as stream:
              manifest = yaml.safe_load(stream)
          assert manifest["app-id"] == "org.sharexf.ShareXF"
          assert manifest["runtime-version"] == "25.08"
          assert manifest["command"] == "sharexf"
          assert any(module["name"] == "sharexf" for module in manifest["modules"])
          print("Flatpak manifest structure is valid.")
          PY
